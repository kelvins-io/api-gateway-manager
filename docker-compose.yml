services:
  postgres:
    image: postgres:13
    container_name: agm-postgres
    environment:
      POSTGRES_USER: agm
      POSTGRES_PASSWORD: agm123
      POSTGRES_DB: api_gateway_manager
    ports:
      - "15444:5432"
    volumes:
      - agm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agm -d api_gateway_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

