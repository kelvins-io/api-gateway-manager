services:
  postgres:
    image: postgres:13
    container_name: agm-postgres
    environment:
      POSTGRES_USER: agm
      POSTGRES_PASSWORD: agm123
      POSTGRES_DB: api_gateway_manager
    ports:
      - "15444:5432"
    volumes:
      - agm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agm -d api_gateway_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agm-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGM_DATABASE_HOST: postgres
      AGM_DATABASE_PORT: "5432"
      AGM_DATABASE_USER: agm
      AGM_DATABASE_PASSWORD: agm123
      AGM_DATABASE_DBNAME: api_gateway_manager
      AGM_SERVER_MODE: release
      AGM_JWT_SECRET: ${AGM_JWT_SECRET:-api-gateway-manager-jwt-secret-change-me}
    ports:
      - "${AGM_BACKEND_PORT:-10000}:10000"
    restart: unless-stopped
    networks:
      - agm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
    container_name: agm-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5373:80"
    restart: unless-stopped
    networks:
      - agm

