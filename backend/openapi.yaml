          type: string
    CreateSpaceRequest:
      type: object
      required: [name, prefix]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
        description:
          type: string
          maxLength: 512
        prefix:
          type: string
          maxLength: 128
          description: 以 / 开头的路径前缀，例如 /order 或 /team/order
          example: /order
    UpdateSpaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
