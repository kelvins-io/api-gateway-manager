openapi: 3.0.3
info:
  title: API Gateway Manager
  version: 1.0.0
  description: |
    基于 Kong 的 API 网关管理系统 HTTP API。

    成功响应统一为 `{ "code": 0, "message": "ok", "data": ... }`。无业务数据时省略 `data`。
    失败响应为 `{ "code": <HTTP 状态码>, "message": "..." }`，HTTP 状态与 `code` 一致：
    400 参数错误、401 未登录或 token 无效、403 权限不足、404 资源不存在、409 冲突、500 服务器错误。

    除 `/health`、`/api/v1/auth/register`、`/api/v1/auth/login` 外，均需 `Authorization: Bearer <JWT>`。
    `system_admin` 可绕过空间成员校验。空间写操作（创建分组、发布 API、管理成员/上游/消费者/插件等）需要 `space_admin`。
    服务对任意路径的 `OPTIONS` 预检返回 204，并允许 `Authorization`、`Content-Type`。

    默认监听 `http://localhost:10000`。
servers:
  - url: http://localhost:10000
    description: 本地后端
tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 注册、登录与当前用户
  - name: Space
    description: 空间与成员
  - name: Gateway
    description: Kong 网关
  - name: Group
    description: API 分组
  - name: API
    description: API 定义、发布与版本
  - name: Market
    description: API 市场
  - name: Upstream
    description: 空间级 Upstream
  - name: Consumer
    description: 空间级 Consumer
  - name: Plugin
    description: 空间级插件模板
  - name: Debug
    description: REST 调试代理与调试历史

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      operationId: health
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthData"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册
      description: 首个注册用户角色为 `system_admin`，之后为 `member`。用户名已存在时返回 409。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 当前用户
      operationId: getMe
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces:
    get:
      tags: [Space]
      summary: 空间列表
      description: 系统管理员返回全部空间；其他用户只返回自己已加入或申请中的空间，并带上 `member_status`。
      operationId: listSpaces
      responses:
        "200":
          $ref: "#/components/responses/SpaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Space]
      summary: 创建空间
      description: |
        系统管理员创建的空间状态为 `active`，其他用户为 `pending`，需系统管理员审批后生效。
        `prefix` 形如 `/order` 或 `/team/order`，全局唯一，创建后不可修改。创建者成为该空间的 `space_admin`。
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
      responses:
        "200":
          $ref: "#/components/responses/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/available:
    get:
      tags: [Space]
      summary: 可加入的空间
      description: 返回状态为 `active` 且当前用户尚未加入、也未申请的空间。
      operationId: listAvailableSpaces
      responses:
        "200":
          $ref: "#/components/responses/SpaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Space]
      summary: 空间详情
      description: 需要该空间的有效成员身份。
      operationId: getSpace
      responses:
        "200":
          $ref: "#/components/responses/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Space]
      summary: 更新空间
      description: 需要空间管理员。只更新名称和描述，不修改路径前缀。
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceRequest"
      responses:
        "200":
          $ref: "#/components/responses/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Space]
      summary: 删除空间
      description: 需要空间管理员。空间下仍有分组、Upstream、Consumer 或 Plugin 时返回 409。
      operationId: deleteSpace
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    post:
      tags: [Space]
      summary: 审批通过空间
      description: 需要系统管理员。通过后空间状态变为 `active`。
      operationId: approveSpace
      responses:
        "200":
          $ref: "#/components/responses/Space"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    post:
      tags: [Space]
      summary: 拒绝空间申请
      description: 需要系统管理员。
      operationId: rejectSpace
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/join:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    post:
      tags: [Space]
      summary: 申请加入空间
      description: 空间必须为 `active`。普通用户生成 `pending` 成员申请；系统管理员直接以 `space_admin` 加入。
      operationId: joinSpace
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/members:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Space]
      summary: 成员列表
      description: 需要空间成员。
      operationId: listSpaceMembers
      responses:
        "200":
          $ref: "#/components/responses/SpaceMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Space]
      summary: 添加成员
      description: 需要空间管理员。直接将用户加为有效成员；若该用户已有待审批申请，则按本次角色通过。
      operationId: addSpaceMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/members/candidates:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Space]
      summary: 可添加的用户
      description: 需要空间管理员。返回尚未属于该空间的用户。
      operationId: listSpaceMemberCandidates
      responses:
        "200":
          $ref: "#/components/responses/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/members/{uid}/approve:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Space]
      summary: 通过成员申请
      description: 需要空间管理员。
      operationId: approveSpaceMember
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/members/{uid}/reject:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Space]
      summary: 拒绝成员申请
      description: 需要空间管理员。
      operationId: rejectSpaceMember
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/members/{uid}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Space]
      summary: 移除成员
      description: 需要空间管理员。
      operationId: removeSpaceMember
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/members/{uid}/role:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Space]
      summary: 修改成员角色
      description: 需要空间管理员。
      operationId: updateSpaceMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/groups:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Group]
      summary: 分组列表
      description: 需要空间成员。
      operationId: listGroups
      responses:
        "200":
          $ref: "#/components/responses/GroupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Group]
      summary: 创建分组
      description: 需要空间管理员。网关必须是共享网关，或已授权给该空间的私有网关。同一空间内分组名唯一。
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "200":
          $ref: "#/components/responses/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/gateway-options:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Gateway]
      summary: 空间可用网关
      description: 需要空间成员。返回共享网关，以及已授权给该空间的私有网关。不包含 Admin API 地址。
      operationId: listGatewayOptionsForSpace
      responses:
        "200":
          $ref: "#/components/responses/GatewayOptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/gateways-options:
    get:
      tags: [Gateway]
      summary: 共享网关选项
      description: 只返回共享网关的 id、名称和网络区域，不包含 Admin API。绑定分组时优先使用空间维度的 `/spaces/{id}/gateway-options`。
      operationId: listGatewayOptions
      responses:
        "200":
          $ref: "#/components/responses/GatewayOptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/gateways:
    get:
      tags: [Gateway]
      summary: 网关列表
      description: 需要系统管理员。
      operationId: listGateways
      responses:
        "200":
          $ref: "#/components/responses/GatewayList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Gateway]
      summary: 创建网关
      description: 需要系统管理员。创建前会探测 Admin API。`domain` 必须是 `ip:port` 或 `域名:port`。`shared` 省略时默认为 true。
      operationId: createGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGatewayRequest"
      responses:
        "200":
          $ref: "#/components/responses/Gateway"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/gateways/probe:
    post:
      tags: [Gateway]
      summary: 探测 Admin API
      description: 需要系统管理员。确认 Kong Admin API 可访问。
      operationId: probeGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeGatewayRequest"
      responses:
        "200":
          description: 探测成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/gateways/{id}:
    parameters:
      - $ref: "#/components/parameters/GatewayId"
    get:
      tags: [Gateway]
      summary: 网关详情
      description: 需要系统管理员。
      operationId: getGateway
      responses:
        "200":
          $ref: "#/components/responses/Gateway"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Gateway]
      summary: 更新网关
      description: 需要系统管理员。变更 Admin API 时会重新探测。
      operationId: updateGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGatewayRequest"
      responses:
        "200":
          $ref: "#/components/responses/Gateway"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Gateway]
      summary: 删除网关
      description: 需要系统管理员。仍被 API 分组使用时返回 409。
      operationId: deleteGateway
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/gateways/{id}/unauthorized-spaces:
    parameters:
      - $ref: "#/components/parameters/GatewayId"
    get:
      tags: [Gateway]
      summary: 尚未授权的空间
      description: 需要系统管理员。仅私有网关可用，返回尚未授权且状态为 `active` 的空间。
      operationId: listUnauthorizedSpaces
      responses:
        "200":
          $ref: "#/components/responses/SpaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/gateways/{id}/authorize-spaces:
    parameters:
      - $ref: "#/components/parameters/GatewayId"
    post:
      tags: [Gateway]
      summary: 授权空间使用私有网关
      description: 需要系统管理员。共享网关不需要授权。空间必须处于 `active`。
      operationId: authorizeGatewaySpaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeSpacesRequest"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/groups/{gid}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Group]
      summary: 分组详情
      description: 需要所属空间的成员身份。
      operationId: getGroup
      responses:
        "200":
