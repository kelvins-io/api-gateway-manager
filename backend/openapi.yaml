    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [space_admin, member]
    CreateGatewayRequest:
      type: object
      required: [name, admin_api, domain, network_zone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
        admin_api:
          type: string
          minLength: 8
          maxLength: 512
          example: http://127.0.0.1:8001
        domain:
          type: string
          maxLength: 255
          description: ip:port 或域名:port
          example: 127.0.0.1:8000
        network_zone:
          type: string
          enum: ["内网", DMZ]
        shared:
          type: boolean
          default: true
    UpdateGatewayRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
        admin_api:
          type: string
          minLength: 8
          maxLength: 512
        domain:
          type: string
          maxLength: 255
        network_zone:
          type: string
          enum: ["内网", DMZ]
        shared:
          type: boolean
    ProbeGatewayRequest:
      type: object
      required: [admin_api]
      properties:
        admin_api:
          type: string
          minLength: 8
          maxLength: 512
    AuthorizeSpacesRequest:
      type: object
      required: [space_ids]
      properties:
        space_ids:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Id"
    CreateGroupRequest:
      type: object
      required: [name, gateway_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        gateway_id:
          $ref: "#/components/schemas/Id"
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    CreateAPIRequest:
      type: object
      required: [name, access_path, access_methods]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        access_path:
          type: string
          minLength: 1
          maxLength: 2048
          description: 逗号、换行或分号分隔。会自动加上空间前缀。含 * 或显式 ~ 的路径按 Kong 正则路由处理。
        access_methods:
          type: string
          description: 逗号分隔，保存时转为大写
          example: GET,POST
        access_protocols:
          type: string
          description: 逗号分隔的 http、https、grpc、grpcs。空则默认为 http
        access_hosts:
          type: string
        access_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        service_protocol:
          type: string
          enum: [http, https, grpc, grpcs]
          default: http
        service_host_kind:
          type: string
          enum: [direct, upstream]
          default: direct
        service_host:
          type: string
          description: direct 时必填主机名或 IP
        service_upstream_id:
          type: integer
          format: int64
          description: service_host_kind=upstream 时必填，且必须属于同一空间
        service_port:
          type: integer
          minimum: 80
          maximum: 65535
          default: 80
        service_path:
          type: string
          default: /
          description: 单个以 / 开头的路径
        service_retries:
          type: integer
          minimum: 0
          default: 5
        service_connect_timeout:
          type: integer
          description: 毫秒，默认 60000
          default: 60000
        service_write_timeout:
          type: integer
          default: 60000
        service_read_timeout:
          type: integer
          default: 60000
        access_strip_path:
          type: boolean
          default: true
        request_buffering:
          type: boolean
          default: true
        response_buffering:
          type: boolean
          default: true
        auth_enabled:
          type: boolean
          default: false
        auth_plugin:
          type: string
          enum: [key-auth, basic-auth, jwt, hmac-auth]
          description: auth_enabled 为 true 时必填，创建后不可更改
        auth_config:
          type: object
          additionalProperties: true
        plugin_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
    UpdateAPIRequest:
      type: object
      description: 未传的字段保持不变。认证开关和认证类型不可修改。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        access_path:
          type: string
          minLength: 1
          maxLength: 2048
        access_methods:
          type: string
        access_protocols:
          type: string
        access_hosts:
          type: string
        access_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        service_protocol:
          type: string
          enum: [http, https, grpc, grpcs]
        service_host_kind:
          type: string
          enum: [direct, upstream]
        service_host:
          type: string
        service_upstream_id:
          type: integer
          format: int64
        service_port:
          type: integer
          minimum: 80
          maximum: 65535
        service_path:
          type: string
        service_retries:
          type: integer
          minimum: 0
        service_connect_timeout:
          type: integer
        service_write_timeout:
          type: integer
        service_read_timeout:
          type: integer
        access_strip_path:
          type: boolean
        request_buffering:
          type: boolean
        response_buffering:
          type: boolean
        auth_enabled:
          type: boolean
          description: 必须与当前值相同
        auth_plugin:
          type: string
          description: 已开启认证时必须与当前插件相同
        auth_config:
          type: object
          additionalProperties: true
        plugin_ids:
          type: array
          description: 传入则整体替换插件绑定；不传则保持不变
          items:
            $ref: "#/components/schemas/Id"
    SwitchVersionRequest:
      type: object
      required: [version]
