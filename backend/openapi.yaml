          type: string
          format: binary
          description: OpenAPI 3 或 Swagger 2 的 JSON/YAML 文件
        dry_run:
          type: string
          description: true、1 或 yes 时只预览，不落库
        service_protocol:
          type: string
          enum: [http, https, grpc, grpcs]
        service_host:
          type: string
        service_port:
          type: integer
        service_path:
          type: string
    UpsertUpstreamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$"
        algorithm:
          type: string
          enum: [round-robin, consistent-hashing, least-connections, latency]
          default: round-robin
        slots:
          type: integer
          minimum: 10
          maximum: 65536
          default: 10000
        hash_on:
          type: string
        hash_fallback:
          type: string
        hash_on_header:
          type: string
        hash_fallback_header:
          type: string
        hash_on_cookie:
          type: string
        hash_on_cookie_path:
          type: string
        hash_on_query_arg:
          type: string
        hash_fallback_query_arg:
          type: string
        hash_on_uri_capture:
          type: string
        hash_fallback_uri_capture:
          type: string
        healthchecks:
          $ref: "#/components/schemas/HealthInput"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetInput"
    TargetInput:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: host:port 或 ip:port
          example: 10.0.0.1:8080
        weight:
          type: integer
          default: 100
    HealthInput:
      type: object
      nullable: true
      properties:
        active:
          $ref: "#/components/schemas/HealthSide"
        passive:
          $ref: "#/components/schemas/HealthSide"
        threshold:
          type: number
          format: double
    HealthSide:
      type: object
      properties:
        type:
          type: string
          description: 主动检查类型，例如 http、https、tcp
        http_path:
          type: string
        timeout:
          type: integer
        concurrency:
          type: integer
        https_verify_certificate:
          type: boolean
        healthy_interval:
          type: integer
        healthy_successes:
          type: integer
        healthy_http_statuses:
          type: array
          items:
            type: integer
        unhealthy_interval:
          type: integer
        unhealthy_http_failures:
          type: integer
        unhealthy_tcp_failures:
          type: integer
        unhealthy_timeouts:
          type: integer
        unhealthy_http_statuses:
          type: array
          items:
            type: integer
    UpsertConsumerRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        custom_id:
          type: string
          description: 非空时同样受用户名规则约束，空间内唯一
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialInput"
        api_ids:
          type: array
          description: 关联本空间已开启对应认证插件的 API，整体替换
          items:
            $ref: "#/components/schemas/Id"
    CredentialInput:
      type: object
      required: [plugin]
      description: |
        config 为字符串键值。
        key-auth：key 可省略，服务端生成。
        basic-auth：需要 username、password。
        jwt：algorithm 默认 HS256，支持 HS256/HS384/HS512/RS256/RS384/RS512/ES256/ES384；HS 算法可省略 secret，非 HS 需要 rsa_public_key；key 可省略。
        hmac-auth：需要 username，secret 可省略。
        acl：需要 group。
      properties:
        plugin:
          type: string
          enum: [key-auth, basic-auth, jwt, hmac-auth, acl]
        config:
          type: object
          additionalProperties:
            type: string
    UpsertPluginRequest:
      type: object
      required: [name, plugin]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        plugin:
          $ref: "#/components/schemas/PluginKind"
        config:
          type: object
          additionalProperties: true
          description: Kong 插件配置，缺省字段按插件类型补默认值
        enabled:
          type: boolean
          default: true
    DebugProxyRequest:
      type: object
      required: [method, url]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
          format: uri
          description: 仅允许 http 或 https
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        body_base64:
          type: string
          description: 与 body 二选一，优先使用二进制正文
        timeout_ms:
          type: integer
          description: 默认 30000，最大 120000
          maximum: 120000
    CreateDebugHistoryRequest:
      type: object
      required: [method, url, request]
      properties:
        title:
          type: string
          maxLength: 255
        api_id:
          type: integer
          format: int64
        api_name:
          type: string
          maxLength: 128
        method:
          type: string
        url:
          type: string
          maxLength: 2048
        request:
          type: object
          additionalProperties: true
          description: 调试请求快照，序列化后不超过 512 KiB
