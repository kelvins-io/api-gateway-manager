      tags: [Plugin]
      summary: 更新插件模板
      description: 需要空间管理员。插件类型不可修改。已发布且绑定该插件的 API 会把插件配置同步到 Kong。
      operationId: updatePlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPluginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Plugin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Plugin]
      summary: 删除插件模板
      description: 需要空间管理员。仍关联 API 时返回 409。
      operationId: deletePlugin
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/plugins/{pid}/apis:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [Plugin]
      summary: 插件已绑定的 API
      description: 需要空间成员。
      operationId: listPluginApis
      responses:
        "200":
          $ref: "#/components/responses/APIList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/debug-histories:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Debug]
      summary: 调试历史列表
      description: 需要空间成员。按 id 倒序，最多 200 条，包含创建人。
      operationId: listDebugHistories
      responses:
        "200":
          $ref: "#/components/responses/DebugHistoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Debug]
      summary: 保存调试历史
      description: 需要空间成员。标题省略时使用 `METHOD URL`。请求快照最大 512 KiB。
      operationId: createDebugHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDebugHistoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DebugHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/spaces/{id}/debug-histories/{hid}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/HistoryId"
    get:
      tags: [Debug]
      summary: 调试历史详情
      description: 需要空间成员。
      operationId: getDebugHistory
      responses:
        "200":
          $ref: "#/components/responses/DebugHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Debug]
      summary: 删除调试历史
      description: 创建者、空间管理员或系统管理员可删除。
      operationId: deleteDebugHistory
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/debug/proxy:
    post:
      tags: [Debug]
      summary: 代理调试请求
      description: |
        由后端代发 HTTP/HTTPS 请求，绕过浏览器 CORS。
        方法限于 GET、POST、PUT、PATCH、DELETE、HEAD、OPTIONS。
        超时默认 30 秒，最大 120 秒。响应体最大 2 MiB，超出部分截断并将 `truncated` 置为 true。
      operationId: debugProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebugProxyRequest"
      responses:
        "200":
          $ref: "#/components/responses/DebugProxy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录或注册返回的 JWT，请求头格式为 Authorization: Bearer <token>。"

  parameters:
    SpaceId:
      name: id
      in: path
      required: true
      description: 空间 ID
      schema:
        $ref: "#/components/schemas/Id"
    GatewayId:
      name: id
      in: path
      required: true
      description: 网关 ID
      schema:
        $ref: "#/components/schemas/Id"
    GroupId:
      name: gid
      in: path
      required: true
      description: 分组 ID
      schema:
        $ref: "#/components/schemas/Id"
    ApiId:
      name: aid
      in: path
      required: true
      description: API ID
      schema:
        $ref: "#/components/schemas/Id"
    UserId:
      name: uid
      in: path
      required: true
      description: 用户 ID
      schema:
        $ref: "#/components/schemas/Id"
    UpstreamId:
      name: upid
      in: path
      required: true
      description: Upstream ID
      schema:
        $ref: "#/components/schemas/Id"
    ConsumerId:
      name: cid
      in: path
      required: true
      description: Consumer ID
      schema:
        $ref: "#/components/schemas/Id"
    PluginId:
      name: pid
      in: path
      required: true
      description: 插件 ID
      schema:
        $ref: "#/components/schemas/Id"
    HistoryId:
      name: hid
      in: path
      required: true
      description: 调试历史 ID
      schema:
        $ref: "#/components/schemas/Id"
    Version:
      name: version
      in: path
      required: true
      description: 版本号，例如 v1
      schema:
        type: string
        example: v1

  responses:
    Empty:
      description: 成功，无 data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Success"
    AuthResult:
      description: 登录或注册成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
    User:
      description: 用户
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
    UserList:
      description: 用户列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
    Space:
      description: 空间
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Space"
    SpaceList:
      description: 空间列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Space"
    SpaceMemberList:
      description: 成员列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpaceMember"
    Gateway:
      description: 网关
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Gateway"
    GatewayList:
      description: 网关列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gateway"
    GatewayOptionList:
      description: 网关选项
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GatewayOption"
    Group:
      description: 分组
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/APIGroup"
    GroupList:
      description: 分组列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIGroup"
    API:
      description: API
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/API"
    APIList:
      description: API 列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/API"
    APIVersionList:
      description: 版本列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIVersion"
    ImportOpenAPI:
      description: 导入结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportOpenAPIResult"
    Upstream:
      description: Upstream
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Upstream"
    UpstreamList:
      description: Upstream 列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Upstream"
    Consumer:
      description: Consumer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Consumer"
    ConsumerList:
      description: Consumer 列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consumer"
    Plugin:
      description: 插件
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plugin"
    PluginList:
      description: 插件列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plugin"
    DebugHistory:
      description: 调试历史
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DebugHistory"
    DebugHistoryList:
      description: 调试历史列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DebugHistory"
    DebugProxy:
      description: 调试代理结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DebugProxyResult"
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            code: 400
            message: bad request
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            code: 401
            message: invalid token
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            code: 403
            message: forbidden
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            code: 404
            message: not found
    Conflict:
      description: 冲突，例如名称已存在或状态不允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            code: 409
            message: conflict
    ServerError:
      description: 服务器错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            code: 500
            message: internal error

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    Success:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 与 HTTP 状态码一致
        message:
          type: string
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: up
    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        role:
          type: string
          enum: [system_admin, member]
          description: 全局角色。空间内角色见 SpaceMember.role
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Space:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        description:
          type: string
        prefix:
          type: string
          description: 路径前缀，例如 /order
          example: /order
        owner_id:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum: [pending, active]
        group_count:
          type: integer
          format: int64
        upstream_count:
          type: integer
          format: int64
        consumer_count:
          type: integer
          format: int64
        plugin_count:
          type: integer
          format: int64
        member_status:
          type: string
          enum: [pending, active]
          description: 当前用户在该空间的成员状态，仅列表接口可能返回
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpaceMember:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        space_id:
          $ref: "#/components/schemas/Id"
        user_id:
          $ref: "#/components/schemas/Id"
        role:
          type: string
          enum: [space_admin, member]
        status:
          type: string
          enum: [pending, active]
        user:
          $ref: "#/components/schemas/User"
        space:
          $ref: "#/components/schemas/Space"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Gateway:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        admin_api:
          type: string
          description: Kong Admin API 地址
          example: http://127.0.0.1:8001
        domain:
          type: string
          description: 网关入口，ip:port 或域名:port
          example: gateway.example.com:8000
        network_zone:
          type: string
          enum: ["内网", DMZ]
        shared:
          type: boolean
          description: true 为共享网关，所有空间可用；false 需按空间授权
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GatewayOption:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        network_zone:
          type: string
          enum: ["内网", DMZ]
    APIGroup:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        space_id:
          $ref: "#/components/schemas/Id"
        gateway_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        gateway:
          $ref: "#/components/schemas/Gateway"
        space:
          $ref: "#/components/schemas/Space"
        api_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    API:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        group_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        access_path:
          type: string
          description: 逗号分隔的访问路径，正则路径以 ~ 开头
        access_methods:
          type: string
          description: 逗号分隔的大写 HTTP 方法
          example: GET,POST
        access_protocols:
          type: string
          description: 逗号分隔，取值为 http、https、grpc、grpcs
          example: http
        access_hosts:
          type: string
        access_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
        upstream_url:
          type: string
        service_protocol:
          type: string
          enum: [http, https, grpc, grpcs]
        service_host_kind:
          type: string
          enum: [direct, upstream]
        service_host:
          type: string
          description: direct 时为上游主机名；upstream 时为 Kong upstream 名称
        service_upstream_id:
          $ref: "#/components/schemas/Id"
        service_port:
          type: integer
        service_path:
          type: string
        service_retries:
          type: integer
        service_connect_timeout:
          type: integer
          description: 毫秒
        service_write_timeout:
          type: integer
          description: 毫秒
        service_read_timeout:
          type: integer
          description: 毫秒
        access_strip_path:
          type: boolean
        request_buffering:
          type: boolean
        response_buffering:
          type: boolean
        auth_enabled:
          type: boolean
        auth_plugin:
          type: string
          enum: ["", key-auth, basic-auth, jwt, hmac-auth]
        auth_config:
          type: object
          additionalProperties: true
          nullable: true
        status:
          type: string
          enum: [draft, published, offline]
        current_version:
          type: string
          example: v1
        shared:
          type: boolean
          description: 是否分享到 API 市场
        kong_service_id:
          type: string
        kong_route_id:
          type: string
        group:
          $ref: "#/components/schemas/APIGroup"
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/Consumer"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    APIVersion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        api_id:
          $ref: "#/components/schemas/Id"
        version:
          type: string
          example: v1
        config_snapshot:
          $ref: "#/components/schemas/APIConfigSnapshot"
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    APIConfigSnapshot:
      type: object
      description: 发布时保存的配置快照。旧数据可能还带有 path、methods、protocol、host 等历史字段。
      properties:
        name:
          type: string
        access_path:
          type: string
        access_methods:
          type: string
        access_protocols:
          type: string
        access_hosts:
          type: string
        access_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        service_protocol:
          type: string
        service_host_kind:
          type: string
        service_host:
          type: string
        service_upstream_id:
          type: integer
          format: int64
        kong_host:
          type: string
        service_port:
          type: integer
        service_path:
          type: string
        service_retries:
          type: integer
        service_connect_timeout:
          type: integer
        service_write_timeout:
          type: integer
        service_read_timeout:
          type: integer
        access_strip_path:
          type: boolean
        request_buffering:
          type: boolean
        response_buffering:
          type: boolean
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginSnapshot"
    PluginSnapshot:
      type: object
      properties:
        name:
          type: string
        plugin:
          type: string
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
    Plugin:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        space_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        plugin:
          $ref: "#/components/schemas/PluginKind"
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        api_count:
